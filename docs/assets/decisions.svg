<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Design choices / explicit tradeoffs</title><desc id="desc">No measured result is implied by the architecture or tradeoff diagram.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e"/></marker></defs><rect width="1040" height="480" rx="16" fill="#f6f8fc"/><text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17263c" font-weight="700" xml:space="preserve">Design choices / explicit tradeoffs</text><text x="32" y="75" font-family="Arial, sans-serif" font-size="15" fill="#526278" font-weight="400" xml:space="preserve">Engineering decisions embodied in the current data and inference code</text><rect x="24" y="102" width="992" height="72" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="42" y="130" font-family="Arial, sans-serif" font-size="17" fill="#0f766e" font-weight="700" xml:space="preserve">Real COCO boxes</text><text x="300" y="130" font-family="Arial, sans-serif" font-size="16" fill="#17263c" font-weight="400" xml:space="preserve">Correct corner clipping; reject invalid source records</text><text x="300" y="155" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Avoid full-frame pseudo-labels</text><rect x="24" y="184" width="992" height="72" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="42" y="212" font-family="Arial, sans-serif" font-size="17" fill="#0f766e" font-weight="700" xml:space="preserve">Seeded image splits</text><text x="300" y="212" font-family="Arial, sans-serif" font-size="16" fill="#17263c" font-weight="400" xml:space="preserve">Stable IDs + hash-based duplicate rejection</text><text x="300" y="237" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Scene grouping still needs dataset knowledge</text><rect x="24" y="266" width="992" height="72" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="42" y="294" font-family="Arial, sans-serif" font-size="17" fill="#0f766e" font-weight="700" xml:space="preserve">Explicit local weights</text><text x="300" y="294" font-family="Arial, sans-serif" font-size="16" fill="#17263c" font-weight="400" xml:space="preserve">No hidden download; checkpoint hashes in demo exports</text><text x="300" y="319" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Model quality still requires held-out evaluation</text><rect x="24" y="348" width="992" height="72" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="42" y="376" font-family="Arial, sans-serif" font-size="17" fill="#0f766e" font-weight="700" xml:space="preserve">Confidence + NMS IoU</text><text x="300" y="376" font-family="Arial, sans-serif" font-size="16" fill="#17263c" font-weight="400" xml:space="preserve">Adjustable in the local viewer</text><text x="300" y="401" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">Precision/recall changes need actual measurements</text></svg>
