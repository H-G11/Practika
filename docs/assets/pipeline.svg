<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Waste detection / reproducible execution path</title><desc id="desc">Components implemented in src/coco_to_yolo.py, train.py, prediction.py, viewer.py, generate_demo.py and evaluate.py. Runtime inference is blocked in the current environment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e"/></marker></defs><rect width="1040" height="480" rx="16" fill="#f6f8fc"/><text x="32" y="40" font-family="Arial, sans-serif" font-size="24" fill="#17263c" font-weight="700" xml:space="preserve">Waste detection / reproducible execution path</text><text x="32" y="72" font-family="Arial, sans-serif" font-size="15" fill="#526278" font-weight="400" xml:space="preserve">Real annotations in / explicit checkpoints out / no implicit download or fabricated boxes</text><rect x="32" y="116" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="48" y="152" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">COCO + images</text><text x="48" y="182" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">source hashes + file validation</text><rect x="360" y="116" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="376" y="152" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">YOLO dataset</text><text x="376" y="182" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">80 / 10 / 10 image-level split</text><rect x="688" y="116" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="704" y="152" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">YOLOv8 training</text><text x="704" y="182" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">explicit weights / CPU or CUDA</text><rect x="32" y="300" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="48" y="336" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">Outputs + provenance</text><text x="48" y="366" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">actual boxes / raw-prediction pair</text><rect x="360" y="300" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="376" y="336" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">Prediction boundary</text><text x="376" y="366" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">confidence + NMS IoU / local files</text><rect x="688" y="300" width="300" height="96" rx="12" fill="#fff" stroke="#dbe3ec"/><text x="704" y="336" font-family="Arial, sans-serif" font-size="20" fill="#17263c" font-weight="700" xml:space="preserve">Held-out evaluation</text><text x="704" y="366" font-family="Arial, sans-serif" font-size="14" fill="#526278" font-weight="400" xml:space="preserve">mAP + per-class + timed prediction</text><path d="M332 164 L358 164" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 164 L686 164" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><path d="M838 212 L838 298" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><path d="M688 348 L662 348" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 348 L334 348" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="448" font-family="Arial, sans-serif" font-size="15" fill="#0f766e" font-weight="400" xml:space="preserve">Entrypoints: prepare_dataset.py → train.py → evaluate.py / viewe